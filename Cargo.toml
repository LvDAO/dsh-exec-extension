[package]
name = "dsh-exec-extension"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Replace dsh headless-startup with per-invocation --model/--effort/--provider"
repository = "https://github.com/deepseek-ai/deepseek-harness"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
