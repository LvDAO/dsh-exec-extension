[package]
name = "dsh-exec-extension"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "In-process overlay of dsh agentDefaultModel.currentSelection() (CLI is commander in js/)"
repository = "https://github.com/LvDAO/dsh-exec-extension"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
