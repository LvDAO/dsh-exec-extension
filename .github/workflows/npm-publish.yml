# Trusted publishing (OIDC). Do not set NODE_AUTH_TOKEN / NPM_TOKEN here —
# a token forces classic auth and OIDC will not run.
#
# npmjs.com cannot attach a trusted publisher until the package exists, so
# the first version is still a local `npm publish --otp=...`. After that:
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: LvDAO
#     Repository: dsh-exec-extension
#     Workflow filename: npm-publish.yml
#     Allowed actions: npm publish
# Then re-run this workflow (or publish the next GitHub Release).
name: npm-publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish
        run: npm publish --access public
