name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22'
          cache: npm
      - name: wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install dsh CLI
        run: npm install --global pnpm @deepseek-ai/dsh
      - name: Live acceptance
        run: npm run acceptance
